name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-lint:
    runs-on: macos-26
    timeout-minutes: 30
    # Steward, on pull requests only, creates, updates and deletes its
    # summary comment. A job's permissions can't depend on the event, so
    # pushes to main get this too, and use it for nothing.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode (Swift 6.2+ required)
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      - uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/git-diff-parser-tests
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift') }}

      # The log is what Steward's diagnostics rule reads (Dangerfile/).
      - name: Build
        run: |
          set -o pipefail
          swift build --build-tests -Xswiftc -warnings-as-errors 2>&1 | tee build.log

      - name: Run tests
        run: swift test --skip-build

      # Annotates every violation, in or out of the pull request's changes.
      # The log is the same violations in the format Steward reads, from
      # SwiftLint's cache; the annotating run decides the step's outcome.
      - name: SwiftLint
        if: ${{ !cancelled() }}
        run: |
          which swiftlint || brew install swiftlint
          swiftlint lint --quiet > swiftlint.log || true
          swiftlint lint --quiet --reporter github-actions-logging

      # Fails on any DocC warning, such as a broken symbol link. Derived
      # data goes outside .build, which the cache above saves.
      - name: Documentation
        if: ${{ !cancelled() }}
        run: >-
          xcodebuild docbuild -scheme git-diff-parser -destination platform=macOS
          -derivedDataPath "$RUNNER_TEMP/docs" -quiet
          OTHER_DOCC_FLAGS=--warnings-as-errors

      # This repository's Dangerfile/, on the two logs above: it fails on
      # warnings on changed lines and posts one summary comment. Steward
      # refuses push events. Pinned to a commit until steward-action tags v1.
      - name: Steward
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: marosoaie/steward-action@c606a4a637221b3d86c35e18c71aa4bbf6d9fecb

      - name: Test the Dangerfile's rules
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: swift test --package-path Dangerfile

  linux-tests:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      # Before checkout, so actions/checkout makes a real clone. The numstat
      # oracle needs git, and the kernel fixture is .xz, which the image
      # can't decompress without xz-utils.
      - name: Install git and xz
        run: |
          if ! command -v git >/dev/null || ! command -v xz >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends git xz-utils
          fi
          git --version
          xz --version | head -1
          swift --version

      - uses: actions/checkout@v7

      # The fixture cache falls back to $HOME/.cache, and actions/cache
      # expands ~ from the same HOME inside the container. .build stays
      # uncached: the swift:6.2 tag moves across patch releases, a key
      # without the compiler would restore stale modules, and a build
      # without dependencies takes seconds.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/git-diff-parser-tests
          key: fixtures-${{ runner.os }}

      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test --skip-build

      # A minute of coverage-guided fuzzing on top of the seeded mutation
      # tests. libFuzzer ships with Linux toolchains only, and SwiftPM can't
      # link a libFuzzer executable, so it builds the library instrumented
      # and links Fuzz/FuzzTarget.swift with swiftc. A finding fails the
      # step and its input is uploaded.
      - name: Fuzz
        run: |
          swift build -c release --target GitDiffKit --scratch-path .build/fuzz -Xswiftc -sanitize=fuzzer,address
          swiftc -O -sanitize=fuzzer,address -parse-as-library -strict-memory-safety -warnings-as-errors \
            -I .build/fuzz/release/Modules Fuzz/FuzzTarget.swift .build/fuzz/release/GitDiffKit.build/*.o \
            -o .build/fuzz/GitDiffKitFuzz
          mkdir -p .build/fuzz/corpus
          .build/fuzz/GitDiffKitFuzz -max_total_time=60 -max_len=16384 -artifact_prefix=.build/fuzz/ \
            .build/fuzz/corpus Fuzz/Corpus

      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: .build/fuzz/crash-*
          # The findings are under .build, which counts as hidden.
          include-hidden-files: true
          if-no-files-found: ignore
